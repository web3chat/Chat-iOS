allow = ["Bash=cd /Users/zhengchen/Chat-iOS/chat && for d in ProjectBase Libs BusinessTool ChatView User ThirdParty WalletConnect App; do echo \"===== $d =====\"; find \"$d\" -maxdepth 2 -type f \\( -name \"*.swift\" -o -name \"*.h\" -o -name \"*.m\" \\) | head -60; done", "Bash=cd /Users/zhengchen/Chat-iOS && sed -n '1,80p' Podfile && echo \"-----ENTITLEMENTS-----\" && cat chat/chat.entitlements && echo \"-----BRIDGING HEADER-----\" && cat chat/chat-Bridging-Header.h", "Bash=cd /Users/zhengchen/Chat-iOS/chat && echo \"===== Views 一级目录 =====\" && find Views -maxdepth 1 -type d | sort && echo \"===== Views 下 Swift 文件数 =====\" && find Views -name \"*.swift\" | wc -l && echo \"===== ChatView/User 下关键文件 =====\" && ls ChatView | head -30 && echo \"===== 数据库相关 =====\" && grep -rl \"WCDBSwift\\|sqlcipher\\|FMDB\" --include=\"*.swift\" . | grep -v Pods | head -20 && echo \"===== UserManager 头部 =====\" && sed -n '1,50p' User/UserManager.swift", "Bash=cd /Users/zhengchen/Chat-iOS && python3 - <<'EOF'\nimport os, re, glob\n\nroot = \"chat\"\n# 排除 Pods\nskip_dirs = {\"Pods\", \".git\", \".build\", \"Assets.xcassets\", \"*.lproj\"}\n\n# 中文字符串字面量: \"...\" 或 \"...\" 或 @\"...\" 内含中文\npat_lit = re.compile(r'\"([^\"\\n]*[\\u4e00-\\u9fa5]+[^\"\\n]*)\"')\n\ndef scan(path):\n    try:\n        with open(path, 'r', encoding='utf-8-sig', errors='ignore') as f:\n            return f.read()\n    except Exception:\n        return None\n\nswift_zh_total = 0\nswift_zh_unlocalized = 0   # 未用 L() 包裹\noc_zh_total = 0\nunlocalized_samples = {}\nlocalized_uses = 0\n\nfor dirpath, dirnames, filenames in os.walk(root):\n    dirnames[:] = [d for d in dirnames if d not in skip_dirs and not d.endswith('.lproj')]\n    for fn in filenames:\n        ext = os.path.splitext(fn)[1]\n        if ext not in ('.swift', '.m', '.h', '.mm'):\n            continue\n        p = os.path.join(dirpath, fn)\n        content = scan(p)\n        if not content:\n            continue\n        lines = content.split('\\n')\n        for i, line in enumerate(lines):\n            for m in pat_lit.finditer(line):\n                s = m.group(1)\n                if ext == '.swift':\n                    swift_zh_total += 1\n                    before = line[:m.start()]\n                    if 'L(' in before and 'L(\"' not in before.replace('L(\"','',before.count('L(')):\n                        pass\n                    # 判断是否被 L() 包裹: 行内该字面量前最近的括号对\n                    if re.search(r'L\\(\\s*$|L\\([^)]*$', before) and 'L(' in before:\n                        pass\n                    # 简化:检查 before 中最后出现的 'L(' 是否在该字符串前且无其它引号\n                    if 'L(' in before:\n                        # 粗略: 该行前是否有 L( 且本字符串是它的参数\n                        # 找 before 里最后一个 L( 位置\n                        idx = before.rfind('L(')\n                        # L(... 到本字符串之间是否只有空白或已被截断引号\n                        between = before[idx+2:]\n                        if between.strip() == '' or (between.count('\"') % 2 == 1 and re.search(r'\"\\s*$', between)):\n                            localized_uses += 1\n                        else:\n                            swift_zh_unlocalized += 1\n                            unlocalized_samples.setdefault(os.path.join(dirpath, fn), []).append((i+1, line.strip()[:120]))\n                    else:\n                        swift_zh_unlocalized += 1\n                        unlocalized_samples.setdefault(os.path.join(dirpath, fn), []).append((i+1, line.strip()[:120]))\n                else:\n                    oc_zh_total += 1\n\nprint(f\"Swift 含中文的字符串字面量总数: {swift_zh_total}\")\nprint(f\"Swift 未用 L() 包裹(疑似未多语言化): {swift_zh_unlocalized}\")\nprint(f\"Swift 已用 L() 包裹: {localized_uses}\")\nprint(f\"OC(.m/.h/.mm) 含中文的字符串字面量: {oc_zh_total}\")\nprint(f\"\\n未多语言化涉及文件数: {len(unlocalized_samples)}\")\nprint(\"\\nTop 25 文件分布:\")\nfor k, v in sorted(unlocalized_samples.items(), key=lambda kv: -len(kv[1]))[:25]:\n    print(f\"  {len(v):4d}  {k}\")\nEOF"]
